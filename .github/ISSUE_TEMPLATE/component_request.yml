name: Component request
description: Ask for a native version of a drift-ui component, or a feature for an existing one.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Only components that exist in [drift-ui](https://drift-ui.dev/components) are ported here. To propose a new component, open a request in [drift-ui/ui](https://github.com/drift-ui/ui/issues/new/choose) first.
  - type: input
    id: component
    attributes:
      label: Component
      description: The drift-ui component to port, or the native one you want to extend.
      placeholder: tags-input
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: The screen in your app where you need it.
    validations:
      required: true
  - type: textarea
    id: platform-notes
    attributes:
      label: Platform notes
      description: Anything that works differently on iOS or Android, or web features that have no native equivalent.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to build this myself
